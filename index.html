  <!-- Link previews: what this page looks like when someone shares it. -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://byparth.in/" />
  <meta property="og:site_name" content="Parth Sharma" />
  <meta property="og:title" content="Parth Sharma — AI Engineer, Chatbots &amp; Document AI" />
  <meta property="og:description" content="I build chatbots that answer from your own documents — and cite the file every answer came from." />
  <meta property="og:image" content="https://byparth.in/assets/og-cover.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Parth Sharma — AI Engineer, chatbots and RAG systems." />
  <meta name="twitter:card" content="summary_large_image" />

  <meta name="twitter:image" content="https://byparth.in/assets/og-cover.jpg" />

  <!-- The portrait is the largest thing on the first screen, so ask for it
       early and let the browser pick the size that suits the viewport. -->
  <link rel="preload" as="image" href="assets/parth-portrait-sm.jpg"
        imagesrcset="assets/parth-portrait-sm.jpg 560w, assets/parth-portrait.jpg 880w"
        imagesizes="(max-width: 760px) 100vw, 60vw" fetchpriority="high" />

  <!-- Fonts load without holding up the first paint; the stylesheet starts as
       print-only and is promoted once it arrives. display=swap means text is
       readable in a fallback face until then. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" media="print" onload="this.media='all'"
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Manrope:wght@300;400;600&family=IBM+Plex+Mono:wght@400;500&display=swap" />
  <noscript>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Manrope:wght@300;400;600&family=IBM+Plex+Mono:wght@400;500&display=swap" />
  </noscript>

  <link rel="stylesheet" href="styles.css?v=45" />
</head>
<body>
  <!-- Film grain + vignette over the whole film -->
  <div class="grain" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>
  <div class="cursor" id="cursor" aria-hidden="true"><span></span></div>
  <div class="scroll-progress" aria-hidden="true"></div>

  <a class="skip-link" href="#main">Skip to content</a>

  <header class="nav" id="nav"></header>

  <main id="main">
    <!-- Each ACT is a tall scroll track holding a pinned, full-screen stage.
         Scroll progress (0→1) is written to --p on the act and drives the CSS. -->

    <!-- ACT 0 — TITLE CARD: the portrait -->
    <section class="act act-title" id="title" data-len="240"></section>

    <!-- ACT 1 — THE PROBLEM -->
    <section class="act act-problem" id="problem" data-len="260"></section>

    <!-- ACT 2 — THE ANSWER: live assistant -->
    <section class="act act-answer" id="answer" data-len="200"></section>

    <!-- ACT 3 — THE PIPELINE: how a document chatbot actually works.
         Long track: five chapters play out across it, Snackit-style. -->
    <section class="act act-pipeline" id="pipeline" data-len="520"></section>

    <!-- ACT 4 — THE CRAFT: document x-ray (step 02, live) -->
    <section class="act act-craft" id="craft" data-len="120"></section>

    <!-- ACT 5 — INTERROGATE ME: ask box -->
    <section class="act act-ask" id="ask" data-len="120"></section>

    <!-- ACT 6 — WHAT I BUILD -->
    <section class="act act-build" id="build" data-len="220"></section>

    <!-- ACT 7 — THE RECORD: where I've worked, education, training -->
    <section class="act act-record" id="record" data-len="120"></section>

    <!-- ACT 8 — THE INVITATION -->
    <section class="act act-end" id="contact" data-len="140"></section>
  </main>

  <footer class="footer" id="footer"></footer>

  <script src="main.js?v=45" defer></script>
  <script src="sandbox-ask.js?v=45" defer></script>
  <script src="sandbox-xray.js?v=45" defer></script>
</body>
</html>
