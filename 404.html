<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Not here — Parth Sharma</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" href="/assets/favicon.png" />
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; min-height: 100svh; background: #000; color: #B4B8C0;
      font-family: "Segoe UI", system-ui, sans-serif;
      display: grid; place-items: center; text-align: center; padding: 24px;
    }
    .n { font-family: ui-monospace, Consolas, monospace; font-size: .78rem;
         letter-spacing: .22em; color: #FFC94D; margin: 0 0 1rem; }
    h1 { font-size: clamp(1.8rem, 6vw, 3rem); color: #F4F5F7; margin: 0 0 .6rem;
         letter-spacing: -.02em; line-height: 1.1; }
    p { max-width: 42ch; margin: 0 auto 1.6rem; line-height: 1.6; }
    a { display: inline-block; background: #F0B429; color: #08080A; font-weight: 700;
        padding: .8em 1.35em; border-radius: 5px; text-decoration: none; }
    a:hover { filter: brightness(1.06); }
  </style>
</head>
<body>
  <main>
    <p class="n">404</p>
    <h1>There's nothing at this address.</h1>
    <p>Which is at least an honest answer — the same one the assistant on my
       home page gives when it doesn't know something.</p>
    <a href="/">Go to the home page</a>
  </main>
</body>
</html>
